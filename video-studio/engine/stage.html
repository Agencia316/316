<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Anton';src:url('../fonts/Anton-Regular.ttf')}
html,body{margin:0;background:#0b0b10}
#stage{width:1080px;height:1920px;overflow:hidden}
</style></head><body><div id="stage"></div>
<script src="engine.js"></script><script src="formations.js"></script>
<script>
// ?ep=episodes/arquivo.js  &t=segundos  (modo preview no navegador: &play=1)
const q = new URLSearchParams(location.search);
const s = document.createElement('script'); s.src = '../' + (q.get('ep') || 'episodes/exemplo-classico.js');
s.onload = async () => {
  await document.fonts.load("40px Anton");
  window.Studio.render(window.EPISODE, +q.get('t') || 0);
  window.READY = true;
  if (q.get('play')) { const t0 = performance.now(); (function loop(){ const t=((performance.now()-t0)/1000)%Studio.duration(EPISODE); Studio.render(EPISODE,t); requestAnimationFrame(loop); })(); }
};
document.body.appendChild(s);
</script></body></html>
